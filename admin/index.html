<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin · Il Gatto di Cruci</title>
  <link rel="stylesheet" href="/admin/admin.css">
  <link rel="stylesheet" href="/admin/link-page.css">
  <link rel="stylesheet" href="/admin/order-page.css">
</head>
<body>
  <main id="auth-view" class="auth">
    <section>
      <p class="mark">☾</p><h1>Il Gatto di Cruci</h1><p>Area amministratore riservata</p>
      <form id="auth-form" onsubmit="window.adminLogin(event);return false"><label>Email<input id="auth-email" type="email" required autocomplete="email"></label><label>Password<input id="auth-password" type="password" minlength="6" required autocomplete="current-password"></label><button type="button" onclick="window.adminLogin()">Accedi</button><p id="auth-message"></p></form>
    </section>
  </main>
  <div id="app" hidden>
    <header><strong>☾ &nbsp; Il Gatto di Cruci</strong><span>Amministrazione</span><button id="logout">Esci</button></header>
    <div class="layout"><nav id="nav"></nav><main id="content"></main></div>
  </div>
  <script type="module" src="/admin/admin.js"></script>
  <script src="/admin/login-fallback.js"></script>
  <script type="module" src="/admin/import.js"></script>
  <script type="module" src="/admin/auto-import.js"></script>
  <script type="module" src="/admin/edit-products.js"></script>
  <script type="module" src="/admin/catalog-legacy-sync.js"></script>
</body>
</html>

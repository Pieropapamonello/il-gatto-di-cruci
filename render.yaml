services:
  - type: web
    name: il-gatto-di-cruci
    runtime: static
    branch: main
    autoDeployTrigger: commit
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /admin
        name: Cache-Control
        value: no-store
      - path: /admin/*
        name: Cache-Control
        value: no-store
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
